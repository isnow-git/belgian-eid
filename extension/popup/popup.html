<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belgian eID</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header">
      <div class="header-row">
        <div class="logo">
          <svg
            width="18"
            height="18"
            fill="none"
            viewBox="0 0 24 24"
            stroke="white"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 003 10c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.249-8.25-3.286z"
            />
          </svg>
        </div>
        <div>
          <h1>Belgian eID</h1>
          <div class="sub">Chrome extension</div>
        </div>
      </div>
      <div class="flag">
        <div style="background: #000"></div>
        <div style="background: #f5a623"></div>
        <div style="background: #dc2626"></div>
      </div>
    </div>

    <div class="body">
      <div class="status-list">
        <div class="status-row">
          <span class="status-label">Bridge eID</span>
          <span class="badge idle" id="badge-client">
            <div class="spinner" id="spin-client"></div>
            <div class="dot idle" id="dot-client"></div>
            <span id="label-client">…</span>
          </span>
        </div>
        <div class="status-row">
          <span class="status-label">Card reader</span>
          <span class="badge idle" id="badge-reader">
            <div class="dot idle" id="dot-reader"></div>
            <span id="label-reader">—</span>
          </span>
        </div>
        <div class="status-row">
          <span class="status-label">eID card</span>
          <span class="badge idle" id="badge-card">
            <div class="dot idle" id="dot-card"></div>
            <span id="label-card">—</span>
          </span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="version" id="version-label">v—</span>
      <button class="btn-refresh" id="btn-refresh">↻ Refresh</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
