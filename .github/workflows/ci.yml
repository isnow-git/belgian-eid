name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BelgianEid.sln

      - name: Build
        run: dotnet build BelgianEid.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests --configuration Release --no-build --verbosity normal
