# Publishes the BelgianEid NuGet package to nuget.org (keyless, via Trusted
# Publishing / OIDC) and to GitHub Packages (via the built-in GITHUB_TOKEN).
# No API key or manual secret is stored anywhere.
#
# One-time setup on nuget.org (Account → Trusted Publishing → Add policy):
#   Repository Owner : isnow-git
#   Repository       : belgian-eid
#   Workflow File    : publish.yml
#   Environment      : (leave empty)
# No API key and no GitHub secret are required — the nuget.org username below is
# public, and nuget.org issues a short-lived key at run time via GitHub OIDC.
#
# Trigger: publish a GitHub Release (e.g. tag v1.0.0). The release tag drives the
# package version (v1.2.3 → 1.2.3).
name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: GitHub OIDC token for Trusted Publishing (nuget.org)
      contents: read
      packages: write   # required: publish to GitHub Packages (repo "Packages" section)

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from release tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        shell: bash
        run: |
          args=(-c Release -o "$GITHUB_WORKSPACE/artifacts")
          if [ -n "${{ steps.ver.outputs.version }}" ]; then
            args+=("-p:Version=${{ steps.ver.outputs.version }}")
          fi
          dotnet pack library/BelgianEid.csproj "${args[@]}"

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: isnow

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Also publish to GitHub Packages so the package appears in the repo's
      # "Packages" section. GITHUB_TOKEN is built in — no manual secret needed.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/isnow-git/index.json
          --skip-duplicate
